name: build-windows-installer

# ব্যবহার: এই ফাইলসহ রিপো GitHub-এ পুশ করো (branch: main), তারপর GitHub-এর
# "Actions" ট্যাবে গিয়ে "build-windows-installer" workflow-টা বেছে "Run workflow"
# ক্লিক করো (অথবা main-এ পুশ করলেই এমনিতেই চলা শুরু হবে)। শেষে
# "NoorAgent-Windows-Installer" আর্টিফ্যাক্ট থেকে একটাই .exe ডাউনলোড হবে —
# এর ভেতরেই HermesControl.exe (কম্পিউটার-কন্ট্রোল এজেন্ট) বসানো থাকবে,
# ইউজারকে আলাদা করে দ্বিতীয় কিছু ডাউনলোড করতে হবে না।
#
# ⚠️ চালানোর আগে electron_app/resources/hermes-config.json-এ আসল Railway
# gateway URL বসিয়ে কমিট করে নাও — এই ফাইলটাই বিল্ডের ভেতরে বেক হয়ে যাবে।

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: thin_client dependency + pyinstaller install
        run: |
          pip install -r thin_client/requirements.txt
          pip install pyinstaller

      - name: HermesControl.exe বিল্ড করা
        run: pyinstaller --onefile --noconsole --name HermesControl thin_client/agent.py

      - uses: actions/upload-artifact@v4
        with:
          name: HermesControl-exe
          path: dist/HermesControl.exe

  build-electron:
    needs: build-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: HermesControl.exe কে electron resources-এ বসানো
        uses: actions/download-artifact@v4
        with:
          name: HermesControl-exe
          path: electron_app/resources/thin_client

      - name: npm install
        working-directory: electron_app
        run: npm install

      - name: Windows installer বিল্ড (HermesControl.exe সহ merge হয়ে যাবে)
        working-directory: electron_app
        run: npm run build:win

      - name: চূড়ান্ত একক .exe আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: NoorAgent-Windows-Installer
          path: electron_app/release/**/*.exe
