name: build-windows-installer

# ব্যবহার: এই ফাইলসহ রিপো GitHub-এ পুশ করো (branch: main), তারপর GitHub-এর
# "Actions" ট্যাবে গিয়ে "build-windows-installer" workflow-টা বেছে "Run workflow"
# ক্লিক করো (অথবা main-এ পুশ করলেই এমনিতেই চলা শুরু হবে)। এখন এই workflow
# শুধু artifact আপলোড করে না — সরাসরি একটা GitHub Release-ও পাবলিশ করে, যাতে
# ইতিমধ্যে ইনস্টল করা সব ইউজারের অ্যাপ auto-update দিয়ে নিজে থেকেই সেই নতুন
# ভার্সন ধরতে পারে (দেখো electron_app/src/main/auto-update.ts)।
#
# ⚠️ চালানোর আগে electron_app/resources/hermes-config.json-এ আসল Railway
# gateway URL বসিয়ে কমিট করে নাও — এই ফাইলটাই বিল্ডের ভেতরে বেক হয়ে যাবে।
#
# ⚠️ electron_app/electron-builder.yml -> publish.owner/repo নিজের GitHub
# username/repo দিয়ে বদলে নাও, নাহলে publish স্টেপ ফেইল করবে।

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # GitHub Release তৈরি/আপডেট করতে লাগবে

jobs:
  build-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: thin_client dependency + pyinstaller install
        run: |
          pip install -r thin_client/requirements.txt
          pip install pyinstaller

      - name: HermesControl.exe বিল্ড করা
        run: pyinstaller --onefile --noconsole --name HermesControl thin_client/agent.py

      - uses: actions/upload-artifact@v4
        with:
          name: HermesControl-exe
          path: dist/HermesControl.exe

  build-electron:
    needs: build-agent
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: HermesControl.exe কে electron resources-এ বসানো
        uses: actions/download-artifact@v4
        with:
          name: HermesControl-exe
          path: electron_app/resources/thin_client

      - name: npm install
        working-directory: electron_app
        run: npm install

      - name: Windows installer বিল্ড ও GitHub Release-এ পাবলিশ
        working-directory: electron_app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win:publish

      - name: চূড়ান্ত একক .exe আর্টিফ্যাক্ট হিসেবেও রাখা (ম্যানুয়াল ডাউনলোডের জন্য)
        uses: actions/upload-artifact@v4
        with:
          name: NoorAgent-Windows-Installer
          path: electron_app/release/**/*-setup.exe