name: gateway-approval-bridge
version: 1.0.0
description: >-
  চ্যাট (/v1/chat/completions) সেশনে dangerous-command approval-কে আমাদের
  multiuser gateway-র /approvals পপ-আপে ব্রিজ করে (register_gateway_notify/
  resolve_gateway_approval ব্যবহার করে, /v1/runs যেভাবে করে ঠিক সেই একই
  মেকানিজমে)।
author: (তোমার প্রজেক্ট)
provides_hooks:
  - pre_llm_call
  - on_session_end
