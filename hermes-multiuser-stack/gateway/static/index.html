<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Hermes Multiuser — লগইন</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;background:#111;color:#eee}
  input,select{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;background:#222;color:#eee;border:1px solid #444;border-radius:6px}
  button{padding:8px 16px;margin:6px 4px 0 0;border-radius:6px;border:none;background:#4f7cff;color:#fff;cursor:pointer}
  #out{margin-top:20px;padding:12px;background:#1c1c1c;border-radius:8px;word-break:break-all;display:none}
  h2{margin-bottom:4px}
  .hint{color:#888;font-size:.85em}
</style>
</head>
<body>
<h2>Hermes Multiuser Gateway</h2>
<p class="hint">নতুন ইউজার হলে নিচে username/password দিয়ে "রেজিস্টার", আগে থেকে থাকলে "লগইন"।</p>

<input id="u" placeholder="username" autocomplete="username">
<input id="p" placeholder="password" type="password" autocomplete="current-password">
<button onclick="submitAuth('register')">রেজিস্টার</button>
<button onclick="submitAuth('login')">লগইন</button>

<div id="out"></div>

<script>
const GATEWAY_URL = 'https://responsible-purpose-production-e6fd.up.railway.app';

async function submitAuth(kind) {
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  const out = document.getElementById('out');
  out.style.display = 'block';
  out.textContent = 'লোড হচ্ছে...';
  try {
    const res = await fetch(`${GATEWAY_URL}/auth/${kind}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) {
      let msg = data.detail || 'এরর হয়েছে';
      if (Array.isArray(msg)) {
        // FastAPI/Pydantic 422 ভ্যালিডেশন এরর: detail একটা array of objects
        msg = msg.map(e => `${(e.loc || []).join('.')}: ${e.msg}`).join(' | ');
      }
      out.textContent = '❌ ' + msg;
      return;
    }

    const olvHost = prompt(
      'Open-LLM-VTuber ব্যাকএন্ড কোন host:port এ চলছে?',
      'localhost:12393'
    ) || 'localhost:12393';
    const wsUrl = `ws://${olvHost}/client-ws?token=${data.access_token}`;

    out.innerHTML = `
      <b>✅ টোকেন পাওয়া গেছে।</b><br><br>
      VTuber ওয়েব UI-এর Settings → General → WebSocket URL এ নিচেরটা বসাও:<br>
      <code>${wsUrl}</code><br><br>
      <button onclick="navigator.clipboard.writeText('${wsUrl}')">কপি করো</button>
    `;
  } catch (e) {
    out.textContent = '❌ নেটওয়ার্ক এরর: ' + e;
  }
}
</script>
</body>
</html>
